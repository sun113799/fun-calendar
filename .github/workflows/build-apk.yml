name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 删除旧 android 项目（彻底重建）
        run: rm -rf android

      - name: 重新创建 Android 项目
        run: npx cap add android

      - name: 同步网页文件到 Android
        run: npx cap sync android

      - name: 注入通知权限（防被杀）
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 在 <manifest> 标签内加权限
          sed -i 's|<manifest xmlns:android|<!-- 通知保活权限 --><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n<manifest xmlns:android|' "$MANIFEST"
          echo "=== AndroidManifest permissions ==="
          grep "uses-permission" "$MANIFEST"

      - name: 验证 www 文件是最新版
        run: |
          echo "=== index.html 是否含年月选择器 ==="
          grep "yearSelect" www/index.html && echo "YES - v3" || echo "NO - v2!"
          echo "=== css 是否含 date-picker ==="
          grep "date-picker" www/css/style.css && echo "YES - v3" || echo "NO - v2!"

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 趣味日历-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
